plugins {
    id 'com.android.application' version '8.1.0'
    id 'org.jetbrains.kotlin.android' version '1.9.0'
}

android {
    namespace 'snow.iceos.powermenu' // Chú ý: Đổi lại theo đúng package bạn đang dùng trong log
    compileSdk 33

    defaultConfig {
        applicationId "snow.iceos.powermenu"
        minSdk 24
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }

    // THÊM ĐOẠN NÀY ĐỂ ĐỒNG BỘ JAVA 17
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    
    kotlinOptions {
        jvmTarget = '17'
    }
}

